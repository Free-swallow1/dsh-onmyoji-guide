name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package plugin
        run: |
          set -e
          mkdir -p dist/astrbot_plugin_yys
          cp main.py yys_*.py metadata.yaml _conf_schema.json requirements.txt logo.png README.md LICENSE NOTICE dist/astrbot_plugin_yys/
          cp -r data docs dist/astrbot_plugin_yys/
          cd dist
          zip -r astrbot_plugin_yys.zip astrbot_plugin_yys
          ls -lh astrbot_plugin_yys.zip

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/astrbot_plugin_yys.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: astrbot_plugin_yys
          path: dist/astrbot_plugin_yys.zip
